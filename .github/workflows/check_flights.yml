name: Ryanair Price Check

on:
  schedule:
    # Uruchamia się równo co godzinę (o pełnych godzinach UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Pozwala też uruchomić skrypt ręcznie jednym kliknięciem

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
    - name: Pobierz kod repozytorium
      uses: actions/checkout@v4

    - name: Skonfiguruj Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Zainstaluj bibliotekę Requests
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Uruchom skrypt
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python main.py
